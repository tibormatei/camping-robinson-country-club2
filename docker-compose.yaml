# Local development environment:
# Run: docker compose up --build
name: camping-robinson-country-club

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        API_PORT: ${API_PORT}
        API_HOST: ${API_HOST}
        APP_LOG_LEVEL: ${APP_LOG_LEVEL}
    env_file:
      # equivalent to: environment: volume, but env_file load all variables from .env file.
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      # The source code: edits on the host reach the container (--reload).
      # The venv is in /app/.venv, outside this mount, so nothing shadows it.
      - ./backend/codebase:/app/codebase
    depends_on:
      appdb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT}
    env_file:
      # equivalent to: environment: volume, but env_file load all variables from .env file.
      - .env
    environment:
      API_PROXY_TARGET: http://backend:${API_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      # The source code: edits on the host reach the container (hot reload).
      - ./frontend/codebase:/app/codebase
      # node_modules lives in a named volume, so the host's one never shadows it.
      - frontend_node_modules:/app/codebase/node_modules

  appdb:
    build:
      context: ./appdb
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${DB_POSTGRES_DBNAME}
      POSTGRES_USER: ${DB_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
    ports:
      - "${DB_POSTGRES_PORT}:${DB_POSTGRES_PORT}"
    volumes:
      - appdb-volume:/var/lib/postgresql/robinsondata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USERNAME} -d ${DB_POSTGRES_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  appdb-volume:
  frontend_node_modules:
