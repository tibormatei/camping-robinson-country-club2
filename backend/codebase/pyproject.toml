# Python project configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camping-robinson-backend"
version = "0.0.0"
description = "Camping Robinson Country Club 2 backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.1, <1.0.0",
    "uvicorn[standard]>=0.40.0, <1.0.0",
    "pydantic>=2.11.7, <3.11.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0.0, <10.0.0",
    "httpx2>=2.16.0, <3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["robinson"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "N"    # pep8-naming
]
ignore = ["B008"]  # Depends() in argument defaults is normal in FastAPI

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
